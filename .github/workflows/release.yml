# Build the plugin on a version tag and publish the packed tarball as a Release asset.
# 在版本 tag 上构建插件，并把打包产物作为 Release 资产发布。
#
# The repository carries TypeScript sources only, so `lib/` and `client/` are produced
# here, from the very commit the tag points at, and never enter version control.
# 仓库只存 TypeScript 源码，`lib/` 与 `client/` 在这里生成——取自 tag 指向的那个提交，
# 且始终不进版本控制。
#
# Users install the asset directly:
# 使用方直接安装该资产：
#   dsh plugin --profile desktop add \
#     https://github.com/aymidasing/dsh-thinking-lang/releases/download/<tag>/dsh-thinking-lang-<version>.tgz

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      # A tag that disagrees with package.json would publish the tarball under a
      # version its own manifest denies.
      # tag 与 package.json 不一致时，资产的版本号会与包内清单互相矛盾。
      - name: Check the tag against package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      # The published tarball carries no build script, so pnpm never asks for
      # build approval on install; this step produces the artifacts it contains.
      # 发布包不带构建脚本，安装时 pnpm 不会要求构建授权；产物由这一步生成。
      - run: npm run build

      - run: npm pack

      # Fixed-name copy: the catalog and README install through
      # releases/latest/download/dsh-thinking-lang.tgz, which always points at
      # the newest release, so a version bump never needs a catalog PR.
      # 固定名副本：目录与 README 通过 releases/latest/download/dsh-thinking-lang.tgz
      # 安装，永远指向最新版本，发版不必再改目录条目。
      - run: cp dsh-thinking-lang-*.tgz dsh-thinking-lang.tgz

      - run: node scripts/verify-pack.mjs

      - name: Record the tarball digest
        run: sha256sum dsh-thinking-lang-*.tgz dsh-thinking-lang.tgz | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-thinking-lang-*.tgz
            dsh-thinking-lang.tgz
          generate_release_notes: true
